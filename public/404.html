<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | SwiftCredit</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#0A1628,#0A7C4E);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:24px;padding:48px 40px;max-width:440px;width:100%;text-align:center}
.icon{font-size:56px;margin-bottom:20px}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#1A1A2E;margin-bottom:10px}
p{font-size:15px;color:#718096;margin-bottom:28px;line-height:1.6}
a{display:inline-block;padding:13px 32px;background:linear-gradient(135deg,#064F32,#0A7C4E);color:#fff;border-radius:50px;font-family:'Syne',sans-serif;font-size:15px;font-weight:600;text-decoration:none}
a:hover{opacity:0.9}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔍</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
  <a href="/">← Back to SwiftCredit</a>
</div>
</body>
</html>
